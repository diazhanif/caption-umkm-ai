[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caption-umkm-ai"
version = "0.1.0"
description = "CLI untuk membuat prompt grounded bagi copy produk UMKM Indonesia"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "caption-umkm-ai contributors" }]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
caption-umkm = "caption_umkm.core:main"

[tool.setuptools.packages.find]
where = ["src"]
